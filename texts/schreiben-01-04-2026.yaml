text: |-
  Sehr geehrter Herr Jansen,
  
  Ich schreibe Ihnen, um Sie zu informieren, dass ich zurzeit Krank bin. Deshalb kann ich unseres Gespräch leider nich besuchen.
  Ich habe seit gestern eine starke Erkältung und habe heute so hoche Temperatur, dass ich meine Wohnung nicht lassen kann. 
  
  Können diese Bespräch nächste Woche stattfinden? Ich bin sicher, bis Montag werde ich komplett wieder gesund.
  Ich finde das Meeting sehr wichtig, da wir meine Leistung und Ergebnisse besprechen könnten.
  
  Danke Ihnen im Voraus für Ihre Verständnis.
  
  Mit freundlichen Grüßen
  Pavlo Skliar
