text: |-
  Liebe Mütter and Vater,
  
  ich freue mich sehr über ihren Brief. Ich hoffe darauf, dass ihr beide einen wunderschönen Zeit in Japan haben.
  Wie ihr schön wissen, ich bin zurzeit schön in der Jugendcamp, wo ich habe schön mehrere neue Kerle getroffen. 
  Sie heißen Karl und Schmidt, die meine Nahbarn sind, und sie können wirklich gut Tischtennis spielen. 
  Deshalb spielen wir zussamen an jede Möglichkeit.
  Essen hier ist sehr gesund, aber schmekt mich nich sehr gut. I würde gerne ein Pizza essen, wann ich nach Hause zurückgehen.
  Ich finde diese Platz und alle Aktivitäten hier trotz sehr toll. Wir machen sehr viel Sport wie Futbol and Baden.
  Ich werde am diesen Jugendcamp nächstes Jahr auch gern teilnehmen!
  
  Bitte schicktet mir auch Fotos aus Tokyo!
  Mit herzlichen Grüßen,
  Pavlo
