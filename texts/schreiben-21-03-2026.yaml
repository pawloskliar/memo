text: |-
  Guten Tag, Herr Schmidt,
  
  ich schreibe Ihnen, weil ich ein Angebot über deinen Kühlschrank auf eBay gesehen habe.
  Wenn er noch nicht verkauft ist, will ich ein Paar fragen darüber stellen.
  Funkzioniert der Kühlschrank wirklich ohne bestimte Probleme?
  Wenn solche Probleme doch existieren, könnten Sie bitte ihn detaliert beschreiben.
  Auch ich will wissen, ob der Kühlschrank ist schön abholbereit, weil ich den Neuen sehr dringend brauche.
  Am Ende interessiere mich auch der Preis. Der Preis von Ebay 300$ ist für mich aber teuer! Ist es verhaldelbar?
  
  Ich freue mich auf Ihre Antwort!
  
  Vielen Dank
  Pavlo Skliar
