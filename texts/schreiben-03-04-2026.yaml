text: |-
  Liebe Marianne,
  
  es freut mich sehr, dass du nach Berlin kommen willst. Ich bin sicher darüber, werden wir einen wunderbar Zeit hier zusammen haben.
  Ich bin der gleichen Meinung, dass Sommer zu heist in Berlin ist, deshalb wird uns besser in Frühling treffen.
  In Frühling gibt es sehr schönes Wetter, da man die beste Kleidung, wie deine Skirts oder Jeans, antragen kann.
  Ich habe nür eine Bitte an du, um diese Reise zu vorbereinten. Könntest du bitte deines Bettzeug mitnehmen, weil ich leider keine extra habe?
  
  Mit freundlichen Grüßen
  Pavlo
